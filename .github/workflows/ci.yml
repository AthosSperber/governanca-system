name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Selftest
        run: python main.py selftest

      - name: Run academia
        run: python main.py run --app academia

      - name: Run academia simulation
        run: python main.py run --app academia_simulation

      - name: Run academia visualization + verify HTML
        run: |
          python main.py run --app academia_visualization
          test -f output/report_academia_combined.html

      - name: Upload governed artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-artifacts-py${{ matrix.python-version }}
          path: |
            output/
            memory/events.jsonl
          if-no-files-found: ignore
