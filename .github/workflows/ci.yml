name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Selftest
        run: python main.py selftest

      - name: Run academia
        run: python main.py run --app academia

      - name: Run academia simulation
        run: python main.py run --app academia_simulation

      - name: Run academia visualization
        run: python main.py run --app academia_visualization

      - name: Verify visualization artifact
        run: test -f output/report_academia_combined.html

      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: governed-reports
          path: output/
          if-no-files-found: ignore
